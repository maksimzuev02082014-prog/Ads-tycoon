<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Декодер выводов</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  textarea, input { width: 100%; background: #000; color: #0f0;
    border: 1px solid #0f0; padding: 10px; font-family: monospace; margin: 8px 0; }
  button { background: #0f0; color: #000; padding: 10px 20px;
    border: none; font-weight: bold; cursor: pointer; }
  .result { background: #001100; padding: 15px; border: 1px solid #0f0; margin-top: 10px; }
</style>
</head>
<body>
<h2>🔓 Декодер кодов вывода</h2>
<p>Вставь код от игрока:</p>
<textarea id="code" rows="5" placeholder="ADT-..."></textarea>
<button onclick="decode()">Расшифровать</button>
<div class="result" id="result">—</div>

<script>
const SECRET_KEY = "ADTYCOON_2024_SECRET_X9Z"; // ⚠️ ДОЛЖЕН СОВПАДАТЬ с игрой!

function xorCipher(str, key) {
  let out = '';
  for (let i = 0; i < str.length; i++) {
    out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}

function decode() {
  try {
    const input = document.getElementById('code').value.trim();
    if (!input.startsWith('ADT-')) throw new Error('Нет префикса ADT-');

    // Слой 5: убрать префикс и Base64-decode
    const step1 = decodeURIComponent(escape(atob(input.slice(4))));

    // Слой 4: обратная перестановка
    const mid = Math.ceil(step1.length / 2);
    const half2 = step1.slice(0, step1.length - mid);
    const half1 = step1.slice(step1.length - mid);
    // Было: shuffled = b64_2.slice(mid) + b64_2.slice(0, mid)
    // Значит: b64_2 = half1 + half2 (где half1 — вторая половина)
    const b64_2 = half1 + half2;

    // Слой 3: Base64-decode
    const step2 = decodeURIComponent(escape(atob(b64_2)));

    // Слой 2: XOR-decode
    const step3 = xorCipher(step2, SECRET_KEY);

    // Слой 1: Base64-decode
    const json = decodeURIComponent(escape(atob(step3)));
    const data = JSON.parse(json);

    const date = new Date(data.ts).toLocaleString('ru-RU');
    document.getElementById('result').innerHTML = `
      ✅ <b>УСПЕШНО РАСШИФРОВАНО</b><br><br>
      💰 Сумма вывода: <b>${data.coins.toFixed(2)} 🪙</b><br>
      📺 Просмотрено реклам: <b>${data.ads}</b><br>
      🌐 Скорость: <b>${data.speed} Мбит/с</b><br>
      🕒 Время запроса: <b>${date}</b><br>
      🎲 Уникальный ID: <b>${data.rnd}</b><br>
      📌 Версия: ${data.v}
    `;
  } catch (e) {
    document.getElementById('result').innerHTML =
      '❌ <b>Ошибка расшифровки</b><br>' + e.message;
  }
}
</script>
</body>
</html>
